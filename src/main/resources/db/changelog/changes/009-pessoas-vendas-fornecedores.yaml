databaseChangeLog:
  - changeSet:
      id: 009-01-create-fornecedor
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: fornecedor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fornecedor
                    nullable: false
              - column:
                  name: razao_social
                  type: VARCHAR(150)
                  constraints: { nullable: false }
              - column:
                  name: cnpj
                  type: VARCHAR(14)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints: { nullable: false }
  - changeSet:
      id: 009-02-constraints-fornecedor
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: fornecedor
            columnNames: cnpj
            constraintName: uk_fornecedor_cnpj
        - sql:
            sql: ALTER TABLE fornecedor ADD CONSTRAINT ck_fornecedor_cnpj_formato CHECK (cnpj ~ '^[0-9]{14}$')
        - sql:
            sql: ALTER TABLE fornecedor ADD CONSTRAINT ck_fornecedor_status CHECK (status IN ('ATIVO', 'INATIVO'))
  - changeSet:
      id: 009-03-add-fornecedor-jogo
      author: curso-spring-2026
      changes:
        - addColumn:
            tableName: jogo
            columns:
              - column:
                  name: fornecedor_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: jogo
            baseColumnNames: fornecedor_id
            referencedTableName: fornecedor
            referencedColumnNames: id
            constraintName: fk_jogo_fornecedor
            onDelete: RESTRICT
  - changeSet:
      id: 009-04-create-pessoa
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: pessoa
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, primaryKeyName: pk_pessoa, nullable: false }
              - column:
                  name: nome
                  type: VARCHAR(150)
                  constraints: { nullable: false }
              - column:
                  name: email
                  type: VARCHAR(180)
                  constraints: { nullable: false }
              - column:
                  name: cpf
                  type: VARCHAR(11)
                  constraints: { nullable: false }
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: pessoa
            columnNames: cpf
            constraintName: uk_pessoa_cpf
        - addUniqueConstraint:
            tableName: pessoa
            columnNames: email
            constraintName: uk_pessoa_email
        - sql:
            sql: ALTER TABLE pessoa ADD CONSTRAINT ck_pessoa_cpf_formato CHECK (cpf ~ '^[0-9]{11}$')
        - sql:
            sql: ALTER TABLE pessoa ADD CONSTRAINT ck_pessoa_status CHECK (status IN ('ATIVO', 'INATIVO'))
  - changeSet:
      id: 009-05-create-cliente
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: cliente
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, primaryKeyName: pk_cliente, nullable: false }
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_cliente_pessoa }
              - column:
                  name: telefone
                  type: VARCHAR(30)
        - addForeignKeyConstraint:
            baseTableName: cliente
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_cliente_pessoa
            onDelete: RESTRICT
  - changeSet:
      id: 009-06-create-colaborador
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: colaborador
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, primaryKeyName: pk_colaborador, nullable: false }
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_colaborador_pessoa }
              - column:
                  name: matricula
                  type: VARCHAR(30)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_colaborador_matricula }
              - column:
                  name: funcao
                  type: VARCHAR(30)
                  constraints: { nullable: false }
              - column:
                  name: data_admissao
                  type: DATE
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: colaborador
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_colaborador_pessoa
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE colaborador ADD CONSTRAINT ck_colaborador_funcao CHECK (funcao IN ('VENDEDOR', 'ESTOQUISTA', 'GERENTE', 'ADMINISTRATIVO'))
  - changeSet:
      id: 009-07-create-venda
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: venda
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, primaryKeyName: pk_venda, nullable: false }
              - column:
                  name: cliente_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: vendedor_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: data_venda
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: venda
            baseColumnNames: cliente_id
            referencedTableName: cliente
            referencedColumnNames: id
            constraintName: fk_venda_cliente
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: venda
            baseColumnNames: vendedor_id
            referencedTableName: colaborador
            referencedColumnNames: id
            constraintName: fk_venda_vendedor
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE venda ADD CONSTRAINT ck_venda_status CHECK (status IN ('ABERTA', 'FINALIZADA', 'CANCELADA'))
  - changeSet:
      id: 009-08-create-item-venda
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: item_venda
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, primaryKeyName: pk_item_venda, nullable: false }
              - column:
                  name: venda_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: produto_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: quantidade
                  type: NUMERIC(18,3)
                  constraints: { nullable: false }
              - column:
                  name: valor_unitario
                  type: NUMERIC(18,2)
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: item_venda
            columnNames: venda_id, produto_id
            constraintName: uk_item_venda_produto
        - addForeignKeyConstraint:
            baseTableName: item_venda
            baseColumnNames: venda_id
            referencedTableName: venda
            referencedColumnNames: id
            constraintName: fk_item_venda_venda
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: item_venda
            baseColumnNames: produto_id
            referencedTableName: jogo
            referencedColumnNames: id
            constraintName: fk_item_venda_jogo
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE item_venda ADD CONSTRAINT ck_item_venda_quantidade CHECK (quantidade > 0)
        - sql:
            sql: ALTER TABLE item_venda ADD CONSTRAINT ck_item_venda_valor CHECK (valor_unitario >= 0)
