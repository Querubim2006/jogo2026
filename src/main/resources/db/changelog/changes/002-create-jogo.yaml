databaseChangeLog:
  - changeSet:
      id: 002-01-create-jogo
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: jogo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_jogo
                    nullable: false
              - column:
                  name: codigo_barras
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: titulo
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: saldo_estoque
                  type: NUMERIC(18,3)
                  constraints:
                    nullable: false
              - column:
                  name: valor_unitario
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: data_lancamento
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: genero_jogo_id
                  type: BIGINT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: jogo

  - changeSet:
      id: 002-02-unique-codigo-barras
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: jogo
            columnNames: codigo_barras
            constraintName: uk_jogo_codigo_barras
      rollback:
        - dropUniqueConstraint:
            tableName: jogo
            constraintName: uk_jogo_codigo_barras

  - changeSet:
      id: 002-03-foreign-key-genero-jogo
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: jogo
            baseColumnNames: genero_jogo_id
            referencedTableName: genero_jogo
            referencedColumnNames: id
            constraintName: fk_jogo_genero_jogo
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: jogo
            constraintName: fk_jogo_genero_jogo

  - changeSet:
      id: 002-04-check-saldo-estoque
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE jogo
              ADD CONSTRAINT ck_jogo_saldo_estoque
              CHECK (saldo_estoque >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE jogo DROP CONSTRAINT ck_jogo_saldo_estoque

  - changeSet:
      id: 002-05-check-valor-unitario
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE jogo
              ADD CONSTRAINT ck_jogo_valor_unitario
              CHECK (valor_unitario >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE jogo DROP CONSTRAINT ck_jogo_valor_unitario

  - changeSet:
      id: 002-06-check-status-jogo
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE jogo
              ADD CONSTRAINT ck_jogo_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: ALTER TABLE jogo DROP CONSTRAINT ck_jogo_status